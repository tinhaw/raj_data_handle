name: raj-data-handle

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: raj_data_handle
      POSTGRES_USER: raj_data_handle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中配置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U raj_data_handle -d raj_data_handle"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      RAJ_ENVIRONMENT: production
      RAJ_DATABASE_URL: postgresql+asyncpg://raj_data_handle:${POSTGRES_PASSWORD}@postgres:5432/raj_data_handle
      RAJ_REDIS_URL: redis://redis:6379/0
      RAJ_SECRET_KEY: ${RAJ_SECRET_KEY:?请在 .env 中配置 RAJ_SECRET_KEY}
      RAJ_CREDENTIAL_ENCRYPTION_KEY: ${RAJ_CREDENTIAL_ENCRYPTION_KEY:?请在 .env 中配置 RAJ_CREDENTIAL_ENCRYPTION_KEY}
      RAJ_SESSION_COOKIE_SECURE: ${RAJ_SESSION_COOKIE_SECURE:-false}
      RAJ_CORS_ORIGINS: '["http://localhost:8080"]'
      RAJ_STORAGE_ROOT: /app/runtime/uploads
    command:
      - /bin/sh
      - -c
      - alembic upgrade head && uvicorn apps.api.main:app --host 0.0.0.0 --port 8000
    volumes:
      - file-storage:/app/runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    environment:
      RAJ_ENVIRONMENT: production
      RAJ_DATABASE_URL: postgresql+asyncpg://raj_data_handle:${POSTGRES_PASSWORD}@postgres:5432/raj_data_handle
      RAJ_REDIS_URL: redis://redis:6379/0
      RAJ_SECRET_KEY: ${RAJ_SECRET_KEY}
      RAJ_CREDENTIAL_ENCRYPTION_KEY: ${RAJ_CREDENTIAL_ENCRYPTION_KEY}
      RAJ_STORAGE_ROOT: /app/runtime/uploads
    command: ["python", "-m", "apps.worker.main"]
    volumes:
      - file-storage:/app/runtime
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  file-storage:

[project]
name = "raj-data-handle"
version = "0.1.0"
description = "RajWin/RajLuck read-only reconciliation and analysis service"
requires-python = ">=3.12"

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"apps/api/**/*.py" = ["B008"]

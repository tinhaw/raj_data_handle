<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102a43" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Raj 数据处理中心</title>
    <script>
      // Apply a saved theme before the first paint, including on hard refresh.
      try {
        const theme = localStorage.getItem('raj-ui-theme') === 'dark' ? 'dark' : 'light'
        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.dataset.theme = theme
      } catch { /* Default to the existing light theme when storage is blocked. */ }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

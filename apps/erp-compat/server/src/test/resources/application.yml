server:
  servlet:
    session:
      timeout: 30d
      cookie:
        max-age: 30d

spring:
  datasource:
    url: jdbc:h2:mem:erp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
erp:
  storage:
    local-path: target/test-files
  bootstrap-admin:
    username: admin
    password: admin123
  business-zone: Asia/Shanghai
  import-settings:
    max-rows: 20000
  remote-connections:
    encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  compatibility:
    enabled: true
    standalone-auth-enabled: true
    remote-operations-enabled: true

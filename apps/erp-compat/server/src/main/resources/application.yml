server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:}
    session:
      # Keep an authenticated session for 30 days of inactivity and allow the
      # browser to retain its JSESSIONID across restarts for the same period.
      timeout: 30d
      cookie:
        max-age: 30d

spring:
  application:
    name: raj-ads-erp-api
  datasource:
    # No usable default is permitted: this imported service must never create
    # or validate its legacy schema against data_handle accidentally.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:1/erp_compat_disabled}
    username: ${SPRING_DATASOURCE_USERNAME:erp_compat_disabled}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      # Compatibility runtime never owns DDL. Tests override this with
      # validation after applying the imported Flyway fixture; production DDL
      # is exclusively managed by the Raj Data Handle Alembic chain.
      ddl-auto: ${ERP_COMPAT_DDL_AUTO:none}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
  flyway:
    # Legacy Flyway migrations contain an independent identity and remote
    # credential store. They are test fixtures only; production schema changes
    # must be converted into the Raj Data Handle Alembic chain.
    enabled: ${ERP_COMPAT_FLYWAY_ENABLED:false}
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${ERP_IMPORT_MAX_FILE_SIZE:10MB}
      max-request-size: ${ERP_IMPORT_MAX_FILE_SIZE:10MB}
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

erp:
  storage:
    local-path: ${ERP_STORAGE_LOCAL_PATH:./var/files}
  bootstrap-admin:
    username: ${ERP_BOOTSTRAP_ADMIN_USERNAME:}
    password: ${ERP_BOOTSTRAP_ADMIN_PASSWORD:}
  business-zone: ${ERP_BUSINESS_ZONE:Asia/Shanghai}
  import-settings:
    max-rows: ${ERP_IMPORT_MAX_ROWS:20000}
  remote-connections:
    encryption-key: ${ERP_REMOTE_CONNECTIONS_ENCRYPTION_KEY:}
  compatibility:
    enabled: ${ERP_COMPATIBILITY_MODE_ENABLED:false}
    standalone-auth-enabled: ${ERP_COMPAT_STANDALONE_AUTH_ENABLED:false}
    identity-url: ${ERP_COMPAT_IDENTITY_URL:http://api:8000/api/v1/erp/access/compatibility-session}
    remote-registry-url: ${ERP_COMPAT_REMOTE_REGISTRY_URL:http://api:8000/api/v1/erp/remote-accounts/compatibility-registry}
    session-cookie-name: ${ERP_COMPAT_SESSION_COOKIE_NAME:raj_session}
    remote-operations-enabled: ${ERP_COMPAT_REMOTE_OPERATIONS_ENABLED:false}

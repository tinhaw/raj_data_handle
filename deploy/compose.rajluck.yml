# Production Compose stack for the independent Raj Data Handle service on the
# RajLuck analysis ECS. It intentionally does not define a PostgreSQL container:
# RAJ_DATABASE_URL must point to the separate `data_handle` database on the
# target ECS's associated RDS.
name: raj-data-handle

services:
  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      RAJ_ENVIRONMENT: production
      RAJ_DATABASE_URL: ${RAJ_DATABASE_URL:?RAJ_DATABASE_URL is required and must target data_handle RDS}
      RAJ_REDIS_URL: ${RAJ_REDIS_URL:-redis://redis:6379/0}
      RAJ_SECRET_KEY: ${RAJ_SECRET_KEY:?RAJ_SECRET_KEY is required}
      RAJ_CREDENTIAL_ENCRYPTION_KEY: ${RAJ_CREDENTIAL_ENCRYPTION_KEY:?RAJ_CREDENTIAL_ENCRYPTION_KEY is required}
      RAJ_SESSION_COOKIE_SECURE: ${RAJ_SESSION_COOKIE_SECURE:?RAJ_SESSION_COOKIE_SECURE is required}
      RAJ_CORS_ORIGINS: ${RAJ_CORS_ORIGINS:?RAJ_CORS_ORIGINS is required}
      RAJ_STORAGE_ROOT: /app/runtime/uploads
      RAJ_UPLOAD_MAX_BYTES: ${RAJ_UPLOAD_MAX_BYTES:-52428800}
      RAJ_UPLOADED_FILE_RETENTION_DAYS: ${RAJ_UPLOADED_FILE_RETENTION_DAYS:-3}
      RAJ_RESULT_RETENTION_DAYS: ${RAJ_RESULT_RETENTION_DAYS:-30}
      RAJ_REMOTE_CACHE_RETENTION_DAYS: ${RAJ_REMOTE_CACHE_RETENTION_DAYS:-30}
    # Schema migration is deliberately a separate, gated operation.
    command: ["uvicorn", "apps.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      - file-storage:/app/runtime
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    environment:
      RAJ_ENVIRONMENT: production
      RAJ_DATABASE_URL: ${RAJ_DATABASE_URL:?RAJ_DATABASE_URL is required and must target data_handle RDS}
      RAJ_REDIS_URL: ${RAJ_REDIS_URL:-redis://redis:6379/0}
      RAJ_SECRET_KEY: ${RAJ_SECRET_KEY:?RAJ_SECRET_KEY is required}
      RAJ_CREDENTIAL_ENCRYPTION_KEY: ${RAJ_CREDENTIAL_ENCRYPTION_KEY:?RAJ_CREDENTIAL_ENCRYPTION_KEY is required}
      RAJ_STORAGE_ROOT: /app/runtime/uploads
    command: ["python", "-m", "apps.worker.main"]
    volumes:
      - file-storage:/app/runtime
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  erp-compat:
    build:
      context: ..
      dockerfile: deploy/erp-compat.Dockerfile
    environment:
      SPRING_DATASOURCE_URL: ${ERP_COMPAT_DATABASE_URL:?ERP_COMPAT_DATABASE_URL is required}
      SPRING_DATASOURCE_USERNAME: ${ERP_COMPAT_DATABASE_USERNAME:?ERP_COMPAT_DATABASE_USERNAME is required}
      SPRING_DATASOURCE_PASSWORD: ${ERP_COMPAT_DATABASE_PASSWORD:?ERP_COMPAT_DATABASE_PASSWORD is required}
      ERP_COMPATIBILITY_MODE_ENABLED: "true"
      ERP_COMPAT_STANDALONE_AUTH_ENABLED: "false"
      ERP_COMPAT_FLYWAY_ENABLED: "false"
      ERP_COMPAT_DDL_AUTO: none
      ERP_COMPAT_IDENTITY_URL: http://api:8000/api/v1/erp/access/compatibility-session
      ERP_COMPAT_REMOTE_REGISTRY_URL: http://api:8000/api/v1/erp/remote-accounts/compatibility-registry
      ERP_COMPAT_SESSION_COOKIE_NAME: raj_session
      ERP_COMPAT_REMOTE_OPERATIONS_ENABLED: "false"
      ERP_STORAGE_LOCAL_PATH: /app/runtime/erp-compat
    volumes:
      - file-storage:/app/runtime
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    # In cloudflare_reverse_proxy mode this binds only to loopback. The edge
    # proxy below reaches it through the shared host network.
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-18080}:80"
    depends_on:
      api:
        condition: service_healthy
      erp-compat:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  edge-proxy:
    image: nginx:1.27-alpine
    network_mode: host
    volumes:
      - ./nginx.edge.conf:/etc/nginx/nginx.conf:ro
      - /etc/nginx/tls/ailuckdg.com-origin.crt:/etc/nginx/tls/ailuckdg.com-origin.crt:ro
      - /etc/nginx/tls/ailuckdg.com-origin.key:/etc/nginx/tls/ailuckdg.com-origin.key:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  file-storage:

# Reversible legacy-domain entry switch after ERP was merged into Raj Data
# Handle. Only browser-safe reads are redirected: an in-flight write to the old
# origin must never be replayed automatically against the merged application.

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

server {
    listen 443 ssl;
    http2 on;
    server_name erp.aiggtj.com;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/origin.crt;
    ssl_certificate_key /etc/nginx/tls/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Cache-Control "no-store" always;

    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 405;
        }
        return 302 https://analysis.ailuckdg.com$request_uri;
    }
}
